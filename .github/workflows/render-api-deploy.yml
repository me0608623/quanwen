name: Render API Deployment

# 後端 API（quanwen-api.onrender.com）部署：
# apps/api（或共用 packages / lockfile / Dockerfile / 本 workflow）push 到 main
# → build Docker image → push Docker Hub → 觸發 Render redeploy。
# 與前端一致：只有 main 能更新正式 API，禁止本機 docker push。見 CLAUDE.md「部署規則」。
on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/render-api-deploy.yml'

# image 是 last-push-wins → 序列化，新 push 取消還在跑的舊 build（舊的必為過時快照）
concurrency:
  group: render-api-production
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # context=repo 根、dockerfile=apps/api/Dockerfile（與 docker-compose.full.yml 一致，無 build-arg）
      # gha cache 讓後續 build 從幾分鐘降到數十秒
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quanwen-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同步 Drizzle schema 到 Neon —— 必須在 Render redeploy 之前，否則新 image 開機查到缺的表會崩潰（42P01，2026-06-10 事故）。
      # 安全設計：drizzle.config 的 strict 在 CI 關閉（DRIZZLE_PUSH_NONINTERACTIVE=true）→ 純新增（CREATE TABLE / ADD COLUMN）
      # 自動套用；破壞性語句（drop / truncate / not-null on data）會跳 prompt，</dev/null 給 EOF → 中止此步 → fail-fast 不觸發
      # redeploy，交由人工審查。schema 同步失敗就不部署，避免又部署一個會崩的 image。
      - name: Sync Neon schema (drizzle-kit push)
        working-directory: apps/api
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DRIZZLE_PUSH_NONINTERACTIVE: 'true'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL secret 未設定，無法同步 schema（部署中止以免新 image 開機崩潰）"
            exit 1
          fi
          echo "同步 Drizzle schema 到 Neon（純新增自動套用；破壞性變更會中止此步交人工審查）..."
          pnpm exec drizzle-kit push </dev/null

      # Render service autoDeploy=no → 必須用 API 觸發；deploy 會重新 pull latest image
      - name: Trigger Render redeploy
        run: |
          echo "觸發 Render 重部署 (service ${{ secrets.RENDER_SERVICE_ID }})..."
          RESP=$(curl -fsS -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          DEP_ID=$(echo "$RESP" | grep -oE '"id":"[^"]+"' | head -1 | cut -d'"' -f4)
          echo "Render deploy 已建立: $DEP_ID"
