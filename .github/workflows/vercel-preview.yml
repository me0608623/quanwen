name: Vercel Preview Deployment

# 除了 main/develop，任何分支 push 都產生 Preview URL（支援 parallel-code 多 agent worktree
# 自動產生的任意分支名，如 feature-agent-1 / hotfix-agent-3），但碰不到正式站。
# main 走 vercel-production.yml；develop 是 legacy 不部署。
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'
  push:
    branches-ignore:
      - main
      - develop
    # 純文件變動不出 Preview（Obsidian vault、任何 .md）— 省 build
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'

permissions:
  contents: read

# Vercel CLI 用這兩個 env 連結到正確的 team/project（取代 .vercel/project.json）
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # 官方 CLI preview 部署（無 --prod = preview）。CLI 自行等到 READY 才回傳，URL 印在 log。
      - name: Deploy preview to Vercel
        run: vercel deploy --yes --token="${{ secrets.VERCEL_TOKEN }}"
