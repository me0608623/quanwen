name: Vercel Preview Deployment

# feature/agent 分支與 PR 只產生 Preview URL，不碰正式站。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "agent/**"
      - "feat/**"
      - "feature/**"
      - "fix/**"

# 預設 GITHUB_TOKEN 唯讀；action 需要建 deployment 記錄 + 在 PR 留 Preview URL 留言
permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # action 直接 spawn `vercel`，runner 預設沒有 → 需先全域安裝
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Preview to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # 明確關閉 production — 此 action 在 push 事件預設會部署 production
          PRODUCTION: false
