name: Vercel Preview Deployment

# 除了 main/develop，任何分支 push 都產生 Preview URL（支援 parallel-code 多 agent worktree
# 自動產生的任意分支名，如 feature-agent-1 / hotfix-agent-3），但碰不到正式站。
# main 走 vercel-production.yml；develop 是 legacy 不部署。
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'
  push:
    branches-ignore:
      - main
      - develop
    # 純文件變動不出 Preview（Obsidian vault、任何 .md）— 省 build
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'

# 預設 GITHUB_TOKEN 唯讀；action 需要建 deployment 記錄 + 在 PR 留 Preview URL 留言
permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # action 直接 spawn `vercel`，runner 預設沒有 → 需先全域安裝
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Preview to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # 明確關閉 production — 此 action 在 push 事件預設會部署 production
          PRODUCTION: false
