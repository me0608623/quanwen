name: Vercel Production Deployment

# 正式站（quanwen.vercel.app）只能由 main 分支更新。
# 任何 session / agent 禁止本機直接跑 `vercel --prod` — 見 CLAUDE.md「部署規則」。
on:
  push:
    branches:
      - main
    # 純文件變動不部署（Obsidian vault、任何 .md）— 省 build
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'

# 序列化 production 部署：新 push 進來時取消還在跑的舊部署（舊的必為過時快照）
concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

# Vercel CLI 用這兩個 env 連結到正確的 team/project（取代 .vercel/project.json）
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # 保險：官方 CLI 部署正常 1-2 分；超過代表異常，自動停而非無限掛（取代 BetaHuhn 的 hang）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      # 直接用 Vercel 官方 CLI 部署（remote build）。CLI 自行等到 READY 才回傳，
      # 不靠第三方 action 的 readiness 輪詢（BetaHuhn 會撞 deployment protection 的 401 而無限 hang）。
      - name: Deploy to Vercel production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
