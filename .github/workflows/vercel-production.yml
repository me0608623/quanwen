name: Vercel Production Deployment

# 正式站（quanwen.vercel.app）只能由 main 分支更新。
# 任何 session / agent 禁止本機直接跑 `vercel --prod` — 見 CLAUDE.md「部署規則」。
on:
  push:
    branches:
      - main
    # 純文件變動不部署（Obsidian vault、任何 .md）— 省 build
    paths-ignore:
      - 'quanwen/**'
      - '**/*.md'

# 序列化 production 部署：新 push 進來時取消還在跑的舊部署（舊的必為過時快照）
concurrency:
  group: vercel-production
  cancel-in-progress: true

# 預設 GITHUB_TOKEN 唯讀；action 建立 GitHub deployment 記錄需要 deployments: write
permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # action 直接 spawn `vercel`，runner 預設沒有 → 需先全域安裝
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Production to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION: true
