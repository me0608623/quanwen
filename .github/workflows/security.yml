name: Supply-Chain Security

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

jobs:
  bumblebee-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install bumblebee
        run: go install github.com/perplexityai/bumblebee/cmd/bumblebee@v0.1.1

      - name: Self-test
        run: bumblebee selftest

      - name: Scan lockfiles (inventory)
        run: |
          bumblebee scan \
            --profile deep \
            --root "$GITHUB_WORKSPACE" \
            --ecosystem npm \
            2>bumblebee-diagnostics.ndjson \
            | tee bumblebee-inventory.ndjson

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bumblebee-inventory
          path: |
            bumblebee-inventory.ndjson
            bumblebee-diagnostics.ndjson
          retention-days: 30
